name: PSU LMS LINE Notifier

on:
  schedule:
    # รันทุกๆ 2 ชั่วโมง (นาทีที่ 0 ของทุกชั่วโมงคู่ตามเวลา UTC)
    - cron: '0 */2 * * *'
  
  # ปุ่มกดรันด้วยตัวเองผ่านหน้าเว็บ GitHub
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Run Notifier Script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # หรือ LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: python main.py
