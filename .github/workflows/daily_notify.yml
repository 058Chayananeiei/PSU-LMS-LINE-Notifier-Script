name: PSU LMS Daily LINE Notifier
on:
  schedule:
    # รันวันละ 4 รอบ เวลาไทย: 07:00, 12:00, 18:00, 23:00
    # GitHub Actions ใช้เวลา UTC เสมอ (ไทย = UTC+7) จึงตั้งเป็น 00:00, 05:00, 11:00, 16:00 UTC
    - cron: '0 0,5,11,16 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเองเพื่อทดสอบ

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run LINE Notifier
        env:
          LMS_ICAL_URL: ${{ secrets.LMS_ICAL_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
