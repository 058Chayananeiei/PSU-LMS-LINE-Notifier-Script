name: Mark Task as Done
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  mark-done:
    # ทำงานเฉพาะ issue ที่ title ขึ้นต้นด้วย "done:" และเปิดโดยเจ้าของ repo เท่านั้น (กัน spam)
    if: startsWith(github.event.issue.title, 'done:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract task_id and update completed_tasks.json
        run: |
          TITLE="${{ github.event.issue.title }}"
          # ดึงส่วน "done:XXXXXXXX" แล้วตัดเอาแค่รหัส 8 ตัว
          TASK_ID=$(echo "$TITLE" | sed -n 's/^done:\([a-f0-9]\{8\}\).*/\1/p')

          if [ -z "$TASK_ID" ]; then
            echo "❌ ไม่พบ task_id ที่ถูกต้องใน title: $TITLE"
            exit 1
          fi

          echo "📌 task_id ที่จะ mark ว่าเสร็จแล้ว: $TASK_ID"

          if [ ! -f completed_tasks.json ]; then
            echo '{"completed": []}' > completed_tasks.json
          fi

          python3 - "$TASK_ID" <<'EOF'
          import json, sys
          task_id = sys.argv[1]
          with open("completed_tasks.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          ids = set(data.get("completed", []))
          ids.add(task_id)
          data["completed"] = sorted(ids)
          with open("completed_tasks.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit and push completed_tasks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add completed_tasks.json
          git commit -m "✅ mark task done via issue #${{ github.event.issue.number }} [skip ci]"
          git push

      - name: Close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --comment "✅ บันทึกสถานะ 'ทำแล้ว' เรียบร้อยครับ"
