name: PSU LMS Daily LINE Notifier

on:
  schedule:
    # ตั้งเวลารันทุกวัน เวลา 07:00 น. เวลาไทย (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # รองรับการกดปุ่มสั่งรันด้วยตัวเองเพื่อทดสอบ

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run LINE Notifier
        env:
          LMS_ICAL_URL: ${{ secrets.LMS_ICAL_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
