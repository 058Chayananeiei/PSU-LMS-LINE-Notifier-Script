name: Notify Task Done

on:
  repository_dispatch:
    types: [task_completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send LINE Notification
        env:
          LINE_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          TASK_NAME: ${{ github.event.client_payload.task_title }}
        run: |
          curl -X POST "https://notify-api.line.me/api/notify" \
            -H "Authorization: Bearer $LINE_TOKEN" \
            --data-urlencode "message=
          ✅ อัปเดตสถานะงาน!
          ทำเสร็จเรียบร้อยแล้ว: $TASK_NAME
          🎉 เก่งมากครับ! งานค้างลดลงอีก 1 งานแล้ว"
