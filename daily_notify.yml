name: PSU LMS LINE Notifier & Data Sync

on:
  schedule:
    # รันทุกๆ 2 ชั่วโมง (ตามเวลา UTC)
    - cron: '0 */2 * * *'
  
  # ปุ่มกดรันด้วยตัวเองผ่านหน้าเว็บ GitHub
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Main Script
        env:
          LMS_ICAL_URL: ${{ secrets.LMS_ICAL_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: python main.py

      - name: Commit and Push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update data.json from PSU LMS" || exit 0
          git push
